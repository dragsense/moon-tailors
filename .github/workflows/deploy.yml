name: Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "What to rebuild"
        required: true
        default: all
        type: choice
        options:
          - all
          - server
          - client
          - website

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            TARGET="${{ github.event.inputs.target || 'all' }}"
            case "$TARGET" in
              api) TARGET=server ;;
              web) TARGET=client ;;
            esac
            if [ "${{ github.ref_name }}" = "main" ]; then
              git checkout main
              git pull origin main
            else
              git checkout develop
              git pull origin develop
            fi
            node ./scripts/deploy.mjs --target "$TARGET" --env production
