# MediaMTX config for Template (path-based auth for camera streams).
# See https://mediamtx.org/docs/usage/authentication

api: true
apiAddress: ":9997"

hlsAddress: ":8888"
webrtcAddress: ":8889"

hlsAllowOrigins: ["*"]
webrtcAllowOrigins: ["*"]

hlsTrustedProxies: ["127.0.0.1/32", "::1/128"]
webrtcTrustedProxies: ["127.0.0.1/32", "::1/128"]

pathDefaults:
 sourceOnDemand: yes
 sourceOnDemandCloseAfter: 30s

# WebRTC ICE — browser must reach these hosts; add public IP / streamwebrtc host in prod.
webrtcAdditionalHosts:
 - localhost
 - 127.0.0.1

webrtcICEServers2:
 - url: stun:stun.l.google.com:19302

webrtcLocalTCPAddress: ":8189"

authInternalUsers:
 # Anonymous playback (HLS/WHEP). App auth gates who can open cameras / GET /streams.
 - user: any
 pass:
 ips: []
 permissions:
 - action: publish
 path:
 - action: read
 path:
 - action: playback
 path:

 # Control API user (Nest → MediaMTX). Match MEDIAMTX_API_USER / PASS.
 - user: admin
 pass: admin123
 ips: []
 permissions:
 - action: api
 path:
