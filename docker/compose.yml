# Ports from env/docker.env:
#   *_INTERNAL = inside container (always; Docker network)
#   *_EXPOSE   = outside host (optional — omit = no host publish, no deploy check)
#
# Host publish is added only when *_EXPOSE is set (see scripts/docker-env.mjs
# → docker/.compose-publish.yml). This file only `expose`s INTERNAL.

name: ${COMPOSE_PROJECT_NAME:-moon-tailors}

services:
  postgres:
    image: postgres:17
    container_name: ${COMPOSE_PROJECT_NAME:-moon-tailors}-postgres
    expose:
      - "${POSTGRES_INTERNAL:-5432}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moon_tailors_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-no}
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-moon-tailors}-redis
    expose:
      - "${REDIS_INTERNAL:-6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: ${RESTART_POLICY:-no}
    networks:
      - app

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
      target: ${SERVER_BUILD_TARGET:-${BUILD_TARGET:-runtime}}
      args:
        VITE_API_URL: ${VITE_API_URL:-/server/api}
        CLIENT_MODE: ${CLIENT_MODE:-nginx}
    image: ${COMPOSE_PROJECT_NAME:-moon-tailors}-server${IMAGE_SUFFIX:-}
    container_name: ${COMPOSE_PROJECT_NAME:-moon-tailors}-server
    expose:
      - "${SERVER_INTERNAL:-3000}"
    environment:
      NODE_ENV: ${SERVER_NODE_ENV:-${NODE_ENV:-production}}
      ENV_FILE: /app/env/server.env
      PORT: ${SERVER_INTERNAL:-3000}
      # Prod: SPA bind-mounted at /app/client-static (nest serves it; nginx/ssr ignore /app on Nest).
      CLIENT_STATIC_DIR: ${CLIENT_STATIC_DIR:-}
      FORCE_COLOR: "1"
      CLICOLOR_FORCE: "1"
      TERM: xterm-256color
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      WATCHPACK_POLL_INTERVAL: ${WATCHPACK_POLL_INTERVAL:-250}
      TSC_WATCHFILE: ${TSC_WATCHFILE:-UseFsEvents}
      TSC_WATCHDIRECTORY: ${TSC_WATCHDIRECTORY:-UseFsEvents}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${GATEWAY_EXPOSE:-8088}}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:${POSTGRES_INTERNAL:-5432}/${POSTGRES_DB:-moon_tailors_db}
      REDIS_URL: redis://redis:${REDIS_INTERNAL:-6379}
      GATEWAY_EXPOSE: ${GATEWAY_EXPOSE:-8088}
    volumes:
      - ${V_SERVER_1}
      - ${V_SERVER_2}
      - ${V_SERVER_3}
      - ${V_SERVER_4}
      - ${V_SERVER_5}
      - ${V_SERVER_6}
      - ${V_SERVER_7}
      - ${V_SERVER_8}
      - ${V_SERVER_9}
      - ${V_SERVER_10}
      - ${V_SERVER_11}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: ${SERVER_RESTART:-${RESTART_POLICY:-no}}
    tty: true
    networks:
      - app

  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
      target: ${CLIENT_BUILD_TARGET:-${BUILD_TARGET:-runtime}}
      args:
        VITE_API_URL: ${VITE_API_URL:-/server/api}
        CLIENT_SSR: ${CLIENT_SSR:-false}
        CLIENT_ENV_FILE: ${CLIENT_ENV_FILE:-env/client.env}
    image: ${COMPOSE_PROJECT_NAME:-moon-tailors}-client${IMAGE_SUFFIX:-}
    container_name: ${COMPOSE_PROJECT_NAME:-moon-tailors}-client
    expose:
      - "${CLIENT_INTERNAL:-5173}"
    environment:
      NODE_ENV: ${CLIENT_NODE_ENV:-${NODE_ENV:-production}}
      VITE_API_URL: ${VITE_API_URL:-/server/api}
      GATEWAY_EXPOSE: ${GATEWAY_EXPOSE:-8088}
      # From env/client.env (Vite) or forced true when clientMode=ssr — see react-router.config.ts
      CLIENT_SSR: ${CLIENT_SSR:-false}
      FORCE_COLOR: "1"
      CLICOLOR_FORCE: "1"
      TERM: xterm-256color
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      WATCHPACK_POLL_INTERVAL: ${WATCHPACK_POLL_INTERVAL:-250}
      CHOKIDAR_INTERVAL: ${WATCHPACK_POLL_INTERVAL:-250}
    volumes:
      - ${V_CLIENT_1}
      - ${V_CLIENT_2}
      - ${V_CLIENT_3}
      - ${V_CLIENT_4}
      - ${V_CLIENT_5}
      - ${V_CLIENT_6}
      - ${V_CLIENT_7}
      - ${V_CLIENT_8}
      - ${V_CLIENT_9}
      - ${V_CLIENT_10}
    tty: true
    restart: ${CLIENT_RESTART:-${RESTART_POLICY:-no}}
    networks:
      - app

  website:
    build:
      context: ..
      dockerfile: docker/website.Dockerfile
      target: ${WEBSITE_BUILD_TARGET:-${BUILD_TARGET:-runtime}}
      args:
        WEBSITE_ENV_FILE: ${WEBSITE_ENV_FILE:-env/website.env}
    image: ${COMPOSE_PROJECT_NAME:-moon-tailors}-website${IMAGE_SUFFIX:-}
    container_name: ${COMPOSE_PROJECT_NAME:-moon-tailors}-website
    expose:
      - "${WEBSITE_INTERNAL:-4321}"
    environment:
      NODE_ENV: ${WEBSITE_NODE_ENV:-${NODE_ENV:-production}}
      GATEWAY_EXPOSE: ${GATEWAY_EXPOSE:-8088}
      FORCE_COLOR: "1"
      CLICOLOR_FORCE: "1"
      TERM: xterm-256color
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      WATCHPACK_POLL_INTERVAL: ${WATCHPACK_POLL_INTERVAL:-250}
      CHOKIDAR_INTERVAL: ${WATCHPACK_POLL_INTERVAL:-250}
    volumes:
      - ${V_WEBSITE_1}
      - ${V_WEBSITE_2}
      - ${V_WEBSITE_3}
      - ${V_WEBSITE_4}
      - ${V_WEBSITE_5}
      - ${V_WEBSITE_6}
      - ${V_WEBSITE_7}
      - ${V_WEBSITE_8}
    tty: true
    restart: ${WEBSITE_RESTART:-${RESTART_POLICY:-no}}
    networks:
      - app

  # Single public HTTP entry (local GATEWAY_EXPOSE=8088). All other services stay internal.
  gateway:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-moon-tailors}-gateway
    expose:
      - "${GATEWAY_INTERNAL:-80}"
    environment:
      GATEWAY_INTERNAL: ${GATEWAY_INTERNAL:-80}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-localhost}
      SERVER_INTERNAL: ${SERVER_INTERNAL:-3000}
      CLIENT_INTERNAL: ${CLIENT_INTERNAL:-5173}
      WEBSITE_INTERNAL: ${WEBSITE_INTERNAL:-4321}
      GATEWAY_APP_UPSTREAM: ${GATEWAY_APP_UPSTREAM:-client:5173}
    volumes:
      - ${GATEWAY_NGINX_TEMPLATE:-./nginx-gateway.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./gateway-www:/usr/share/nginx/gateway-www:ro
      # Static builds for gateway (prod). Local Vite/Astro use proxy — mounts can be empty.
      - ${GATEWAY_CLIENT_STATIC:-../client/build/client}:/var/www/client:ro
      - ${GATEWAY_WEBSITE_STATIC:-../website/dist}:/var/www/website:ro
    restart: ${GATEWAY_RESTART:-${RESTART_POLICY:-no}}
    networks:
      - app

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-moon_tailors_postgres_data}
  server_logs:
    name: ${LOGS_VOLUME_NAME:-moon_tailors_server_logs}

networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-moon-tailors}-net
    driver: bridge
