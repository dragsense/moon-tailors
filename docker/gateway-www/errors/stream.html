<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stream unavailable — Template</title>
    <link rel="stylesheet" href="/errors/style.css" />
  </head>
  <body>
    <main>
      <div class="badge">502 · stream down</div>
      <div class="icon" aria-hidden="true">▣</div>
      <h1>Media stream is not running</h1>
      <p>
        HLS / WebRTC via MediaMTX did not respond
        (<code>/hls</code>, <code>/webrtc</code>).
      </p>
      <p>Start (or restart) it from the monorepo:</p>
      <p><code>pnpm start server</code></p>
      <div class="actions">
        <a class="button primary" href="javascript:location.reload()">Try again</a>
        <a class="button" href="/">Gateway hub</a>
      </div>
      <p class="hint">
        Check logs with <code>pnpm logs</code> / container
        <code>mediamtx</code>. WebRTC ICE still needs host port
        <code>8189</code> UDP/TCP.
      </p>
    </main>
  </body>
</html>
