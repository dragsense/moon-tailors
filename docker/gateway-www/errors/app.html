<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App unavailable — Template</title>
    <link rel="stylesheet" href="/errors/style.css" />
  </head>
  <body>
    <main>
      <div class="badge">502 · service down</div>
      <div class="icon" aria-hidden="true">▣</div>
      <h1>Client app is not running</h1>
      <p>
        The frontend (<code>/app</code>) did not respond. Vite may be stopped,
        still starting, or the container is down.
      </p>
      <p>Start (or restart) it from the monorepo:</p>
      <p><code>pnpm tpl start</code></p>
      <div class="actions">
        <a class="button primary" href="javascript:location.reload()">Try again</a>
        <a class="button" href="/">Gateway hub</a>
      </div>
      <p class="hint">
        Check logs with <code>pnpm logs client</code> if it keeps failing.
      </p>
    </main>
  </body>
</html>
